name: secret-scan

on:
  pull_request:
  push:
    branches: [main]

permissions: {}

jobs:
  # Renaming this job renames the status, `secret-scan / scan`, and a branch rule
  # matches a status by its name.
  secret-scan:
    permissions:
      contents: read
    uses: specklesystems/.github/.github/workflows/secret-scan.yml@ece6d3eb7787b7200a63c859cda63f4619e96822
